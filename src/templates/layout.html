<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="refresh" content="5">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  
  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
  
  <!-- Base styles (readable without layout) -->
  <!-- Content styles -->
  <link rel="stylesheet" href="pob.css">
  
  <!-- Toggle button for layout switching -->
  <script>
    function toggleLayout() {
      const container = document.getElementById('pob-content');
      const btn = document.getElementById('layout-toggle');
      
      if (container.classList.contains('use-layout')) {
        container.classList.remove('use-layout');
        btn.textContent = '📚 Show Layout';
        localStorage.setItem('pob-layout', 'off');
      } else {
        container.classList.add('use-layout');
        btn.textContent = '📄 Show Naked';
        localStorage.setItem('pob-layout', 'on');
      }
    }
    
    // Restore layout preference
    document.addEventListener('DOMContentLoaded', () => {
      const pref = localStorage.getItem('pob-layout');
      const btn = document.getElementById('layout-toggle');
      const container = document.getElementById('pob-content');
      
      if (pref === 'off' && container) {
        container.classList.remove('use-layout');
        if (btn) btn.textContent = '📚 Show Layout';
      }
    });
  </script>
  
  <!-- Minimal inline styles for the toggle button -->
  <style>
    #layout-toggle {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #333;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    #layout-toggle:hover {
      background: #555;
    }
    
    @media print {
      #layout-toggle { display: none !important; }
    }
  </style>
</head>
<body>
  <!-- Layout toggle button -->
  <button id="layout-toggle" onclick="toggleLayout()">📄 Show Naked</button>
  
  <!-- Content container - isolates from host page -->
  <div id="pob-content" class="pob-content">
    {{content}}
  </div>
</body>
</html>
